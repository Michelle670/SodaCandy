<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}" lang="es">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{staff/fragmentos :: headerStaff}"></div>

    <div class="d-flex flex-grow-1">
        <div th:replace="~{staff/fragmentos :: sidebarStaff}"></div>

        <main class="flex-grow-1 p-4">

            <style>
                .rep-titulo   { color:#590202; font-weight:700; }
                .rep-tabla th { color:#57423f; text-transform:uppercase; font-size:.8rem; }
                .rep-total    { background:#590202; color:#fff; font-weight:700; }
                .rep-total td { color:#fff; }
                .rep-card     { border:0; }
            </style>

            <div class="mb-4">
                <h2 class="rep-titulo mb-1">[[#{reporte.titulo}]]</h2>
                <p class="text-muted mb-0">[[#{reporte.subtitulo}]]</p>
            </div>

            <div class="card rep-card shadow-sm">
                <div class="card-body">
                    <table class="table rep-tabla align-middle mb-0">
                        <thead>
                            <tr>
                                <th>[[#{reporte.metodo}]]</th>
                                <th class="text-center">[[#{reporte.cantidad}]]</th>
                                <th class="text-end">[[#{reporte.total}]]</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${lineas}">
                                <td th:text="#{'metodo.' + ${l.metodo}}">Efectivo</td>
                                <td class="text-center">[[${l.cantidad}]]</td>
                                <td class="text-end">&#8353;[[${l.total}]]</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="rep-total">
                                <td>[[#{reporte.totalGeneral}]]</td>
                                <td class="text-center">[[${totalCantidad}]]</td>
                                <td class="text-end fs-5">&#8353;[[${totalVendido}]]</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <div th:replace="~{staff/fragmentos :: footerStaff}"></div>

</body>
</html>
