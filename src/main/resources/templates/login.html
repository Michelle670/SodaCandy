<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<div th:with="seccion='login'">
    <header th:replace="~{general/fragmentos :: headerPublico}"></header>
</div>

<div class="row my-5">
    <div class="col-md-4 offset-md-4">
        <div class="card shadow-sm">
            <div class="card-header text-white text-center" style="background-color:var(--soda-vino);">
                <h2 class="mb-0"><i class="fa-solid fa-lock me-2"></i>[[#{login.login}]]</h2>
            </div>
            <div class="card-body">
                <form method="POST" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label">[[#{login.username}]]</label>
                        <input class="form-control" id="username" type="text" name="username" required autofocus/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">[[#{login.password}]]</label>
                        <input class="form-control" id="password" type="password" name="password" required/>
                    </div>
                    <div class="d-grid mt-4">
                        <button class="btn text-white" style="background-color:var(--soda-naranja);" type="submit">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>[[#{login.login}]]
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a th:href="@{/acceso/recuperar}">[[#{login.olvidoClave}]]</a>
                </div>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger mt-3 text-center" role="alert">
            [[#{error.login}]]
        </div>
        <div th:if="${param.logout}" class="alert alert-success mt-3 text-center" role="alert">
            [[#{login.salida}]]
        </div>
        <section th:replace="~{general/fragmentos :: mostrarToast}"/>
    </div>
</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
