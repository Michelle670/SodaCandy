spring.application.name=sodacandy
# Se define el puerto por el que escucha el servidor web
server.port=80

#Se define el formato de hora del log de la consola
logging.pattern.dateformat=hh:mm

#Se evita el mensaje de SPRING en banner
spring.main.banner-mode=off

#Se evita el uso de cache en produccion en desarrollo; luego en prd si
spring.thymeleaf.cache=false

#Conexion local a la BD soda_candy en MySQL
#  -> Cambie el host/usuario/clave por los de su entorno (local o Aiven).
spring.datasource.url=jdbc:mysql://localhost:3306/soda_candy
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mostrar informacion SQL en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE
